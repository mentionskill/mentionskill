# On a version tag (v1.0.0, …): zip the skill for clients that take an upload (Claude, ChatGPT) and attach it to a
# GitHub release. https://github.com/mentionskill/mentionskill/releases/latest/download/mentionskill-skill.zip
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill (the mentionskill/ folder at the zip's root)
        run: |
          cd skills && zip -rq -X ../mentionskill-skill.zip mentionskill
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mentionskill-skill.zip --title "$GITHUB_REF_NAME" \
            --notes "MentionSkill skill $GITHUB_REF_NAME. Install instructions at https://mentionskill.com/#install"
